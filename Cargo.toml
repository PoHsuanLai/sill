[workspace]
resolver = "3"
members = [
  "crates/sill-bar",
  "crates/sill-dock",
  "crates/sill-ipc",
  "crates/sill-launcher",
  "crates/sill-launcher-ui",
  "crates/sill-model",
  "crates/sill-notify-ui",
  "crates/sill-overlays",
  "crates/sill-search",
  "crates/sill-shell-kit",
  "crates/sill-services",
  "crates/sill-settings",
  "crates/sill-testkit",
  "crates/sill-ui-kit",
  "crates/sill-widgets-ui",
  "crates/sill",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What blitz needs at the pinned rev; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.91"
repository = "https://github.com/PoHsuanLai/sill"
publish = false

[workspace.dependencies]
sill-ipc      = { path = "crates/sill-ipc" }
sill-launcher = { path = "crates/sill-launcher" }
sill-model    = { path = "crates/sill-model" }
sill-search   = { path = "crates/sill-search" }
sill-shell-kit = { path = "crates/sill-shell-kit" }
sill-services = { path = "crates/sill-services" }
sill-settings = { path = "crates/sill-settings" }
sill-testkit  = { path = "crates/sill-testkit" }
sill-ui-kit   = { path = "crates/sill-ui-kit" }
sill-bar = { path = "crates/sill-bar" }
sill-launcher-ui = { path = "crates/sill-launcher-ui", default-features = false }
sill-dock = { path = "crates/sill-dock" }
sill-widgets-ui = { path = "crates/sill-widgets-ui" }
sill-notify-ui = { path = "crates/sill-notify-ui" }
sill-overlays = { path = "crates/sill-overlays" }
# Sibling repos, checked out next to this one.
ds-behaviour = { path = "../quire/crates/ds-behaviour" }
ds-core    = { path = "../quire/crates/ds-core" }
ds         = { path = "../quire/crates/ds" }
ds-lint    = { path = "../quire/crates/ds-lint" }
ds-shell   = { path = "../quire/crates/ds-shell" }
ds-settings = { path = "../quire/crates/ds-settings", features = ["tokio"] }  # the shell runs zbus on tokio everywhere (quire CONSUMING §1)
# The Blitz host glue: sill takes only its rect measurer (`ds_blitz::measure`), and the test driver
# (`ds-harness`) for its surface tests.
ds-blitz   = { path = "../quire/crates/ds-blitz" }
ds-harness = { path = "../quire/crates/ds-harness" }
shell-host = { path = "../shell-host/crates/shell-host" }
# The viewer's format library and the launcher's half of its desktop contract: the pane's peeks
# (`anyview-peek`), the vocabulary (`anyview-core`), the history the viewer keeps
# (`anyview-store`), the viewer's D-Bus requests and its thumbnail cache (`anyview-platform`),
# and the picture type a thumbnail becomes (`anyview-image`). Taken by path from the
# sibling checkout until anyview is merged and its revision is pinned in quire's
# `docs/workspace-deps.toml` like pdfrum (FINDINGS: "anyview is taken by path").
anyview-core = { path = "../anyview/crates/anyview-core" }
anyview-fs = { path = "../anyview/crates/anyview-fs" }
anyview-image = { path = "../anyview/crates/anyview-image" }
anyview-peek = { path = "../anyview/crates/anyview-peek", default-features = false, features = ["pane"] }
# `quire-desktop` is the D-Bus half (`anyview_platform::linux`: `DbusInstance`, `forward_over`,
# `FreedesktopThumbnails`); anyview-platform leaves it off by default.
anyview-platform = { path = "../anyview/crates/anyview-platform", features = ["quire-desktop"] }
anyview-store = { path = "../anyview/crates/anyview-store" }

# ---- BEGIN PINNED BLOCK (source of truth: quire/docs/workspace-deps.toml) ----
# Copied verbatim into [workspace.dependencies] of quire, shell-host and sill. Bumped only by a
# dedicated "toolchain bump" wave that runs every repo's gates. Versions of the render stack
# (anyrender, vello, wgpu, parley) are the ones blitz's own Cargo.lock resolves at this rev;
# taffy (git) and stylo come through the blitz crates and are never named directly.

# The portable Blitz repairs (own repo, public). Local checkouts redirect it to a sibling path through
# each workspace root's [patch] (quire/CONSUMING.md section 1); git consumers get this rev.
blitz-kit = { git = "https://github.com/PoHsuanLai/blitz-kit", rev = "c6b142d062046c19139c2f423496faf436e52bd7" }

# The portable keymap core (own repo, public): actions, chords, the resolver and per-platform
# sources. quire is the one toolkit integration (`ds::keys`); apps declare their actions with it.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "ba094c62006c280ac53c4c5df5c0e639c1226c07" }

# Blitz: git main, pinned by rev (crates.io dioxus-native 0.8 alpha does not build with
# blitz 0.3.0-beta.2). The in-tree dioxus-native-dom targets dioxus 0.7.x.
# Blitz comes from our fork (github.com/PoHsuanLai/blitz): upstream e99fbdbd plus the restyle fix
# (a cancelled animation's last value no longer sticks), the same rev as quire and shell-host.
blitz-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
blitz-paint = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4", features = ["custom-widget"] }
# The HTML parser (html5ever 0.39): an `<iframe srcdoc>` builds a real sub-document. ds-blitz
# installs it in headless documents; the window gets it through dioxus-native's `html` feature.
blitz-html = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4" }
# The system clipboard's text/html, for an edit surface's paste (ds-blitz): blitz-shell's own
# arboard (its `clipboard` feature, same features), read directly since ShellProvider has text only.
arboard = { version = "3.6", default-features = false }
# Safe syscalls where std has none: SOCK_SEQPACKET for the palmrest socket (shell-host
# input/palmrest.rs, palmrest), hidraw/uinput ioctls (palmrest). Already in every tree through
# wayland-backend at 1.1.x; the features are the union of both users.
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }
blitz-traits = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4" }
dioxus-native-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4", default-features = false, features = ["svg", "system-fonts", "accessibility"] }
# The portable window path for apps (winit); the shell uses shell-host instead.
dioxus-native = { git = "https://github.com/PoHsuanLai/blitz", rev = "cf4cb3981e97ea5feacf9f3a5e13001b69bbc0a4", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }

# Dioxus 0.7.x (renderer-free core; mailo is on 0.7.10).
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-document = "0.7"

# Render stack, matched to blitz's lockfile at the rev above.
anyrender = "0.13"
anyrender_vello_hybrid = "0.10"
anyrender_vello_cpu = { version = "0.17", features = ["multithreading", "filters"] }
vello_hybrid = "0.1"
wgpu = "29"
wgpu_context = "0.9"
# Per-device image cache for the shared hybrid renderer (anyrender_vello_hybrid names both).
rustc-hash = "2"
vello_common = "0.1"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Wayland client (shell-host and sill share one sctk major: cosmic-client-toolkit uses 0.20).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.8"
raw-window-handle = "0.6"
keyboard-types = "0.7"
cursor-icon = "1"

# Common.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
thiserror = "2"
# Local wall-clock time with the system time zone (the bar clock); std cannot answer it.
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cosmic-config's file format: `sill session import-input` writes it, and a test parses the seeds in dist/cosmic.
ron = "0.12"
futures-timer = "3"
cssparser = "0.37"
notify = "8.2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
dirs = "6"
toml = "1"
# SSR renders for component goldens and markup lint (dev-dependency in consumers).
dioxus-ssr = "0.7"
# Named directly for image paints in custom widgets (blitz re-exports nothing).
peniko = "0.6"
# Proc-macro crates for ds-settings-derive.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Shell-only (COSMIC).
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9" }
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
cosmic-dbus-networkmanager = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
logind-zbus = "5"
libpulse-binding = "2.30"
system-tray = "0.8.9"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4"
nucleo-matcher = "0.3.1"
fend-core = "1.5.8"
clap = { version = "4", features = ["derive"] }
# latchkey: its own repo since 2026-10-07 (split out of mailo with its history).
latchkey = { git = "https://github.com/PoHsuanLai/latchkey", rev = "335d7a7c65bc7d196d5f19dfb305896ff3a55958" }
# ---- END PINNED BLOCK ----

# sill-only, outside the pinned block (they are not shared with quire or shell-host).
# The launcher-ui tests write a freedesktop thumbnail by hand: its name is the MD5 of the file's URI
# and its text chunks are PNG's. Both MIT OR Apache-2.0, both already in the lock through anyview.
md-5 = "0.10"
png = "0.18"
# DDC/CI to external monitors over /dev/i2c-N: the `Ddc` trait (VCP get/set) and its Linux i2c
# transport. Both MIT; `with-linux` only, never `with-linux-enumerate` (that links libudev):
# sill maps connectors to buses itself from sysfs and the EDID each bus answers with.
ddc = "0.2"
ddc-i2c = { version = "0.2.2", default-features = false, features = ["with-linux"] }
# PAM for the lock screen's password check: MIT, a safe API
# over libpam with pre-generated bindings (no bindgen or libclang at build time, unlike pam-sys
# 1.0 under `pam` and `pam-client`). Linked only into the `sill auth-check` helper's code path.
nonstick = "0.1.2"
# The launcher's emoji: every fully-qualified emoji with its CLDR
# short name, group, skin-tone variants and GitHub shortcodes; (MIT OR Apache-2.0) AND
# Unicode-3.0 for its generated data. Keywords come from CLDR annotations bundled as
# `crates/sill-search/data/emoji-keywords.tsv` (Unicode-3.0), not from a crate.
emojis = "0.9"
# A file's MIME type from its name, when the index gave none (fd, plocate): MIT.
mime_guess = "2.0"
# The web fallback's `{query}` escaping (RFC 3986): MIT OR Apache-2.0, already in the tree.
percent-encoding = "2.3"
# The keycap daemon's socket contract (messages, `ProfileName`, `Status`): sibling checkout,
# MIT OR Apache-2.0 like every repo here; serde, serde_json and thiserror only, so sill-model
# stays pure.
keycap-protocol = { path = "../keycap/crates/keycap-protocol" }
# keycap's program end: `KeycapSource`, the chordkit keymap source of this desktop (the keycap
# daemon's keymap, the machine's and the person's keymap files), which every surface's `Ds` loads.
keycap-client = { path = "../keycap/crates/keycap-client" }
# intentd's wire: the vocabulary of a confirmation (`ConfirmRequest`, `ConfirmAnswer`), the
# manifest and the invocation, as plain serde data (porter, almanac and stoker types only: no
# runtime), and the bus names. `docket-client` serves sill's `IntentProvider1` for `org.quire.Shell`
# and `docket-dbus` has the `Confirm1` and `Control` proxies; MIT OR Apache-2.0, sibling checkouts.
docket-core = { path = "../docket/crates/docket-core" }
docket-dbus = { path = "../docket/crates/docket-dbus" }
docket-client = { path = "../docket/crates/docket-client", features = ["dbus"] }
prov = { path = "../porter/crates/prov" }
porter-core = { path = "../porter/crates/porter-core" }
# Test-only: the `ServedBy` a stand-in voiced stamps on a transcript.
porter-infer = { path = "../porter/crates/porter-infer" }
# Who a bus connection is: porter's caller identity (the connection's pid, its cgroup scope), which
# proves whose menu a name serves before an agent's activation trusts a command id it names.
# MIT OR Apache-2.0, a sibling checkout already in the tree through docket-dbus.
porter-dbus = { path = "../porter/crates/porter-dbus" }
# The typed calls on inferd and accountd (guests, answers, the change stream) over the session bus.
# MIT OR Apache-2.0, a sibling checkout; no inference stack and no in-process host.
porter-client = { path = "../porter/crates/porter-client", default-features = false, features = ["dbus"] }
# The companion's wire (the bodies of `org.quire.Companion1`: asks, answers, cards, plans, forms),
# cuad's bus bodies and D-Bus proxies (run states, outcomes, `Cua1.Manager`/`Run`) and memoryd's
# vocabulary and proxies (`MemoryItem`, the timeline): serde data and zbus declarations only, the
# same sibling checkouts as `docket-core`; MIT OR Apache-2.0.
# Test-only: docket's router and its fakes, so a test runs the shell's menu provider under the
# real gate (`crates/sill-services/tests/menu_router.rs`); MIT OR Apache-2.0, sibling checkouts.
docket-router = { path = "../docket/crates/docket-router" }
docket-fake = { path = "../docket/crates/docket-fake" }
policy-point = { path = "../docket/crates/policy-point" }
companion-wire = { path = "../docket/crates/companion-wire" }
# The bodies of `org.quire.Voice1` (begin, the fd's events, ends, refusals): serde data only.
voice-wire = { path = "../docket/crates/voice-wire" }
# The caller's side of `org.quire.Voice1`: zbus proxies and the bus names, no audio stack.
voice-dbus = { path = "../docket/crates/voice-dbus" }
cua-bus = { path = "../cua/crates/cua-bus" }
cua-dbus = { path = "../cua/crates/cua-dbus" }
almanac-core = { path = "../almanac/crates/almanac-core" }
almanac-dbus = { path = "../almanac/crates/almanac-dbus" }


[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Local development: one blitz-kit checkout (a sibling of this repo) for every workspace that
# builds it, including quire and shell-host pulled in by path. A dependency's [patch] is ignored by
# its consumers, so outside consumers of quire get the git rev above.
# anyview pins quire by git rev; its ds crates resolve to the ../quire checkout here, so sill
# builds one copy of ds (the manifest pins the rev both use).
[patch."https://github.com/PoHsuanLai/quire.git"]
ds = { path = "../quire/crates/ds" }
ds-behaviour = { path = "../quire/crates/ds-behaviour" }
ds-blitz = { path = "../quire/crates/ds-blitz" }
ds-core = { path = "../quire/crates/ds-core" }
ds-core-derive = { path = "../quire/crates/ds-core-derive" }
ds-harness = { path = "../quire/crates/ds-harness" }
ds-intents = { path = "../quire/crates/ds-intents" }
ds-lint = { path = "../quire/crates/ds-lint" }
ds-motion = { path = "../quire/crates/ds-motion" }
ds-settings = { path = "../quire/crates/ds-settings" }
ds-settings-derive = { path = "../quire/crates/ds-settings-derive" }
ds-style = { path = "../quire/crates/ds-style" }

[patch."https://github.com/PoHsuanLai/blitz-kit"]
blitz-kit = { path = "../blitz-kit/crates/blitz-kit" }

# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }

# porter takes stoker by git rev (porter ARCHITECTURE section 1); the sibling checkout is the one copy of cua-action.
[patch."https://github.com/PoHsuanLai/stoker"]
cua-action = { path = "../stoker/crates/cua-action" }
genai-names = { path = "../stoker/crates/genai-names" }
model-provider = { path = "../stoker/crates/model-provider" }
vision-prep = { path = "../stoker/crates/vision-prep" }

# the git copies of porter, almanac and docket (taken by git inside those repos) are the sibling checkouts here: one copy.
[patch."https://github.com/PoHsuanLai/almanac"]
almanac-core = { path = "../almanac/crates/almanac-core" }

[patch."https://github.com/PoHsuanLai/docket"]
docket-client = { path = "../docket/crates/docket-client" }
docket-core = { path = "../docket/crates/docket-core" }
docket-dbus = { path = "../docket/crates/docket-dbus" }

[patch."https://github.com/PoHsuanLai/porter"]
porter-client = { path = "../porter/crates/porter-client" }
porter-core = { path = "../porter/crates/porter-core" }
porter-dbus = { path = "../porter/crates/porter-dbus" }
porter-infer = { path = "../porter/crates/porter-infer" }
prov = { path = "../porter/crates/prov" }
