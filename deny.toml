# cargo-deny gate. Run: cargo deny check licenses bans sources   (the gate)
#                       cargo deny check advisories              (needs the advisory database, so it
#                                                                  runs wherever the network does)
#
# A dependency whose licence is not listed fails the gate rather than being noticed later by
# someone reading Cargo.lock. A dependency from a registry or a git repository that is not listed
# below fails it too, and a RUSTSEC advisory (or a yanked crate) in the tree fails the advisories
# check.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # bzip2-1.0.6: the bzip2 library's own permissive licence, reached through anyview-archive's bzip2 crate.
    "bzip2-1.0.6",
    # Weak, file-level copyleft. The note below says why this one is here and GPL is not.
    "MPL-2.0",
]
confidence-threshold = 0.9

# MPL-2.0 is allowed, and it is a decision rather than an oversight.
#
# MPL is file-level copyleft: fine to link or depend on, never to paste source from. That
# position is about the *licence*, so encoding it per-crate would be busywork. Several crates
# arrive under it by unrelated routes (stylo, app_units, cssparser and selectors in blitz; option-ext
# through dirs), and the versions churn.
#
# Depending on them obliges us to make *those files'* source available, which their registries
# already do, and obliges nothing of ours. The rule that actually constrains these repositories,
# do not copy MPL source into them, is not something a dependency gate can check; it lives in
# CONVENTIONS.md where it can be read by the person about to break it.
#
# What stays out of that list is strong copyleft: GPL, AGPL, EUPL. Those would change what this
# project may be distributed as, and a dependency arriving under one should stop the build.

# A published advisory or a yanked version in the tree is a failure. An entry in `ignore` names the
# advisory id and carries a comment saying why it does not apply here; there are none today.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # All three are in zip's extract(). zip reaches us through anyview's archive and text readers; neither calls extract.
    # zip 9 fixes them, but calamine 0.36.1 (the newest) requires zip ^8.6. Remove these when
    # calamine moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip's extract() keeps SUID bits; nothing here calls extract, and calamine holds zip at 8" },
    { id = "RUSTSEC-2026-0368", reason = "zip's extract() writes symlinks out of the destination; nothing here calls extract, and calamine holds zip at 8" },
    { id = "RUSTSEC-2026-0369", reason = "zip's extract() sets permissions through symlinks; nothing here calls extract, and calamine holds zip at 8" },
]

# Two versions of a crate is a cost worth seeing, not a failure: blitz, wgpu and zbus pull their
# own. A path dependency without a version is how the workspace names its own crates and the
# sibling checkouts it patches in.
[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

# Crates come from crates.io, or from the git repositories we fork or own (pinned by rev or tag in
# Cargo.toml and Cargo.lock) and the two upstream ones below. Any other source is a decision to
# make here first.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/PoHsuanLai/anyrender",
    "https://github.com/PoHsuanLai/bayonet.git",
    "https://github.com/PoHsuanLai/blitz",
    "https://github.com/PoHsuanLai/blitz-kit",
    "https://github.com/PoHsuanLai/chordkit.git",
    "https://github.com/PoHsuanLai/latchkey",
    "https://github.com/PoHsuanLai/peephole",
    "https://github.com/PoHsuanLai/quire.git",
    "https://github.com/PoHsuanLai/vello",
    "https://github.com/DioxusLabs/taffy",
    "https://github.com/pop-os/dbus-settings-bindings",
]
