<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A private session bus for notification tests and acceptance: the stock session.conf with
     no service directories. The stock config activates whatever claims a name, and on this
     machine /usr/share/dbus-1/services/org.kde.plasma.Notifications.service claims
     org.freedesktop.Notifications, so a Notify on a `dbus-run-session` bus with nobody holding
     the name activates plasma_waitforname. Here nothing is.
     Use it as dbus-run-session's or dbus-daemon's config file (the config-file option; see
     tests/support/private_bus.rs and dev/accept-notifications.sh). -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
