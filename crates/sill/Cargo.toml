[package]
name = "sill"
description = "The sill daemon and command line."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sill-model = { workspace = true }
clap = { workspace = true }
ds-native = { workspace = true }
ds-settings = { workspace = true }
latchkey = { workspace = true }
shell-host = { workspace = true }
sill-ipc = { workspace = true }
sill-launcher = { workspace = true }
sill-search = { workspace = true }
sill-services = { workspace = true }
sill-settings = { workspace = true }
sill-ui-kit = { workspace = true }
sill-widgets-ui = { workspace = true }
sill-notify-ui = { workspace = true }
sill-overlays = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sill-testkit = { workspace = true }
# `tests/lint.rs` mounts every surface on the harness and lints its markup and stylesheet.
sill-ui-kit = { workspace = true, features = ["harness"] }
ds = { workspace = true }
ds-lint = { workspace = true }
ds-shell = { workspace = true }
# The key a `debug key` request parses to (dispatch/debug/inject.rs tests).
keyboard-types = { workspace = true }

[features]
default = []
# `sill debug pointer|leave|capture|key` act on surfaces (shell-host's per-surface injection).
# Without it those requests answer `Failed(Unsupported)`; `debug stats` always works.
debug = ["shell-host/debug-inject"]

[lints]
workspace = true
