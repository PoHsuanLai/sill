[package]
name = "sill"
description = "The sill daemon and command line."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sill-model = { workspace = true }
prov = { workspace = true }
clap = { workspace = true }
ds-lint = { workspace = true }
ds-blitz = { workspace = true }
ds = { workspace = true }
ds-core = { workspace = true }
ds-settings = { workspace = true }
sill-shell-kit = { workspace = true }
latchkey = { workspace = true }
shell-host = { workspace = true }
shell-verbs = { workspace = true }
sill-ipc = { workspace = true }
sill-launcher = { workspace = true }
sill-search = { workspace = true }
sill-services = { workspace = true }
sill-settings = { workspace = true }
sill-ui-kit = { workspace = true }
sill-bar = { workspace = true }
sill-launcher-ui = { workspace = true }
sill-dock = { workspace = true }
sill-notify-ui = { workspace = true }
sill-overlays = { workspace = true }
thiserror = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
zbus = { workspace = true }
voice-wire = { workspace = true }
ds-harness = { workspace = true }
sill-testkit = { workspace = true }
# `tests/lint.rs` mounts every surface on the harness and lints its markup and stylesheet.
sill-ui-kit = { workspace = true, features = ["harness"] }
# The key a `debug key` request parses to (dispatch/debug/inject.rs tests).
keyboard-types = { workspace = true }
# A Space's id in the full-screen rows (edge_reveal.rs tests).
porter-core = { workspace = true }
# The voice bench shared with sill-services' tests names who its stand-in voiced is.
peephole-bus = { workspace = true, features = ["fake"] }

[features]
default = ["media"]
# The launcher's preview pane reads a recording's facts and an audio cover (anyview-peek's `media`,
# pure-Rust header parsers). `--no-default-features` leaves them out of the daemon.
media = ["sill-launcher-ui/media"]
# `sill debug pointer|leave|capture|key` act on surfaces (shell-host's per-surface injection).
# Without it those requests answer `Failed(Unsupported)`; `debug stats` always works. It also gives
# `sill run` the stand-in flags (`--fake-ddc`, `--dev-callers`, ...); a release build has none.
debug = ["shell-host/debug-inject", "sill-services/dev-callers"]

[lints]
workspace = true
