app = "sill"
file = "sill/settings.toml"
version = 1

[[key]]
path = "dock.magnification"
default = "on"
label = "Magnification"
help = "Icons grow as the pointer nears them."
section = "Magnification"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "scroll.natural"
default = "on"
label = "Natural scrolling"
help = "Content follows the finger, like a touchscreen."
section = "Scrolling"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "control_center.modules"
default = []
label = "Modules"
help = "Which modules show, in order."
section = "Layout"
exposure = "advanced"

[key.kind]
kind = "list"
v = "text"

[key.page]
kind = "app"
v = "sill"
