[package]
name = "sill-services"
description = "Effectful services behind watch channels: power, network, volume, tray, apps, COSMIC Wayland state."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sill-launcher = { workspace = true }
nucleo-matcher = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
cosmic-client-toolkit = { workspace = true }
upower_dbus = { workspace = true }
cosmic-dbus-networkmanager = { workspace = true }
libpulse-binding = { workspace = true }
system-tray = { workspace = true }
freedesktop-desktop-entry = { workspace = true }
freedesktop-icons = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
fend-core = { workspace = true }
logind-zbus = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ddc = { workspace = true }
ddc-i2c = { workspace = true }

# `sill-settings` only for `tests/settings_live.rs` (design/22 §9.2's own local-install path,
# `sill_settings::schema().write_to`) — a dev-dependency, not linked into the daemon, so it does
# not cross the `ds-settings`-free boundary `scripts/check-boundary.sh` enforces on this crate's
# normal dependencies (schema_file.rs's module doc explains why the library itself cannot use it).
[dev-dependencies]
sill-settings = { workspace = true }

# A LauncherEntry emitter for exercising badges without a real app: the dock's acceptance and
# `tests/badges_live.rs` run it as a child process.
[[example]]
name = "badge_emitter"

# A fake MPRIS player for exercising Now Playing without a real one: `tests/media_live.rs` runs
# it as a child process, under its own bus name.
[[example]]
name = "mpris_player"

[lints]
workspace = true
