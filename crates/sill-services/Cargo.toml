[package]
name = "sill-services"
description = "Effectful services behind watch channels: power, network, displays, sessions, notifications, launching and the compositor's windows."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `sill run --dev-callers FILE`: callers named in a person's own rows file are let in at
# `Proof::Dev` (peephole's `dev-rows`). Off by default; only the sill binary's `debug` feature turns
# it on, so no shipped build has it (the desktop gate refuses `dev-rows` in any release shape).
dev-callers = ["peephole-bus/dev-rows"]

[dependencies]
anyview-core = { workspace = true }
anyview-platform = { workspace = true }
sill-model = { workspace = true }
sill-launcher = { workspace = true }
ds-core = { workspace = true }
ds-helpers = { workspace = true }
keycap-protocol = { workspace = true }
docket-core = { workspace = true }
docket-dbus = { workspace = true }
docket-client = { workspace = true }
companion-wire = { workspace = true }
voice-wire = { workspace = true }
voice-dbus = { workspace = true }
cua-bus = { workspace = true }
cua-dbus = { workspace = true }
almanac-core = { workspace = true }
almanac-dbus = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
casement-protocols = { workspace = true }
desktop-client = { workspace = true, features = ["client"] }
porter-dbus = { workspace = true }
porter-client = { workspace = true }
peephole-bus = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
upower_dbus = { workspace = true }
libpulse-binding = { workspace = true }
system-tray = { workspace = true }
freedesktop-icons = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
logind-zbus = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ddc = { workspace = true }
ddc-i2c = { workspace = true }
nonstick = { workspace = true }
percent-encoding = { workspace = true }

[dev-dependencies]
desktop-client = { workspace = true, features = ["fake"] }
# A caller that is only a claim (`BusPeers::introduce`): the tests name who their stand-ins are.
peephole-bus = { workspace = true, features = ["fake"] }
# intentd is named from a fixture tree (`<root>/<pid>/cgroup`) in the private-bus tests.
docket-dbus = { workspace = true, features = ["fixture-callers"] }
sill-testkit = { workspace = true }
porter-infer = { workspace = true }
docket-router = { workspace = true }
docket-fake = { workspace = true }
docket-checkpoint = { workspace = true }
policy-point = { workspace = true }

[lints]
workspace = true
