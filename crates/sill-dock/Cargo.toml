[package]
name = "sill-dock"
description = "The dock: tiles, magnification, machines and its context menu."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
sill-shell-kit = { workspace = true }
shell-host = { workspace = true }
sill-launcher = { workspace = true }
sill-model = { workspace = true }
sill-services = { workspace = true }
sill-settings = { workspace = true }
sill-ui-kit = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sill-testkit = { workspace = true }
ds-harness = { workspace = true }
sill-ui-kit = { workspace = true, features = ["harness"] }
ds-lint = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus"] }
shell-host = { workspace = true, features = ["debug-inject"] }

[[example]]
name = "dock_demo"

[lints]
workspace = true
