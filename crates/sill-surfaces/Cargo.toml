[package]
name = "sill-surfaces"
description = "The shell's surfaces and hooks: bar, wallpaper, dock and launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
dioxus-native-dom = { workspace = true }
ds = { workspace = true }
ds-settings = { workspace = true }
shell-host = { workspace = true }
sill-services = { workspace = true }
sill-settings = { workspace = true }
sill-launcher = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
ds = { workspace = true, features = ["lint"] }
dioxus-ssr = { workspace = true }
shell-host = { workspace = true, features = ["debug-inject"] }

# A standalone bar on a real compositor with fake services, for acceptance
# (`dev/accept-bar-ui.sh`); `debug-inject` gives it shell-host's stdin commands.
[[example]]
name = "bar_demo"
