[package]
name = "sill-launcher-ui"
description = "The launcher: its panel, click catcher, rows, preview pane and actions."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `media` (on by default) lets the preview pane read a recording's facts and, for audio, its cover
# (pure-Rust header parsers). Off, a recording previews as its type, size and date.
[features]
default = ["media"]
media = ["anyview-peek/media"]

[dependencies]
anyview-core = { workspace = true }
anyview-image = { workspace = true }
anyview-peek = { workspace = true }
anyview-platform = { workspace = true }
dioxus = { workspace = true }
dirs = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true, features = ["pdf"] }
jiff = { workspace = true }
shell-host = { workspace = true }
sill-launcher = { workspace = true }
sill-model = { workspace = true }
sill-search = { workspace = true }
sill-services = { workspace = true }
sill-settings = { workspace = true }
sill-ui-kit = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
md-5 = { workspace = true }
png = { workspace = true }
sill-testkit = { workspace = true }
ds-harness = { workspace = true }
image = { workspace = true }
sill-ui-kit = { workspace = true, features = ["harness"] }
dioxus-ssr = { workspace = true }
ds-lint = { workspace = true }
ds-shell = { workspace = true }
shell-host = { workspace = true, features = ["debug-inject"] }

[[example]]
name = "launcher_demo"

[lints]
workspace = true
